<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>내 방에 놓아보기 · Design:Gym</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
  #top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;color:#fff;z-index:5;background:linear-gradient(#0008,#0000)}
  #top b{font-size:15px;letter-spacing:.04em}
  #top{z-index:12}
  #home{display:flex;align-items:center;gap:4px;height:38px;padding:0 14px 0 10px;border-radius:19px;background:#fff;color:#111;border:0;font-size:14px;font-weight:700;box-shadow:0 2px 10px #0004;font-family:inherit}
  #home svg{flex:0 0 auto}
  #x{width:40px;height:40px;border-radius:50%;background:#fff;border:0;color:#111;font-size:26px;font-weight:400;line-height:40px;text-align:center;padding:0;box-shadow:0 2px 10px #0004}
  #prog{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#000a;color:#fff;font-size:12px;font-weight:600;z-index:6;white-space:nowrap;backdrop-filter:blur(6px)}
  #prog i{width:10px;height:10px;border-radius:50%;border:2px solid #fff5;border-top-color:#fff;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #savetip{color:#fff;font-size:14px;text-align:center;padding:10px 14px 0;line-height:1.5;display:none}
  #dbg{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 50px);color:#fffb;font-size:11px;z-index:5;text-shadow:0 1px 4px #000;white-space:pre-line}
  #ring{position:fixed;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:4;pointer-events:none;transition:opacity .3s}
  #ring:before,#ring:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #fff;animation:pulse 1.6s ease-out infinite}
  #ring:after{animation-delay:.8s}
  #ring i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
  @keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
  #hint{position:fixed;left:0;right:0;top:calc(50% + 58px);text-align:center;color:#fff;font-size:16px;font-weight:600;text-shadow:0 1px 6px #000a;z-index:4;padding:0 30px;line-height:1.5;pointer-events:none;transition:opacity .3s}
  #hint small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:6px}
  #tip{position:fixed;left:0;right:0;bottom:150px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 6px #000a;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s}
  #bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);z-index:5;background:linear-gradient(#0000,#000a)}
  #chips{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;padding:0;border:0;background:none;font-family:inherit}
  .chip i{display:block;width:40px;height:40px;border-radius:50%;border:3px solid #fff5;transition:transform .15s,border-color .15s}
  .chip span{font-size:12px;font-weight:600;color:#fffc;white-space:nowrap;text-shadow:0 1px 4px #000c;letter-spacing:.01em}
  .chip.on i{border-color:#fff;transform:scale(1.12)}
  .chip.on span{color:#fff;font-weight:800}
  #acts{display:flex;gap:10px}
  #acts button{flex:1;height:50px;border:0;border-radius:12px;font-size:15px;font-weight:700;background:#fff;color:#111}
  #acts button.ghost{background:#fff2;color:#fff}
  #acts button.sq{flex:0 0 50px;font-size:22px}
  #tapori{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:#0007;color:#fff;text-align:center}
  #tapori b{display:block;font-size:18px;margin-bottom:6px}
  #tapori small{font-size:13px;opacity:.85}
  #start{position:fixed;inset:0;z-index:10;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
  #start h1{font-size:20px;margin:0 0 10px}
  #start p{font-size:14px;color:#bbb;line-height:1.6;margin:0 0 26px}
  #start button{width:100%;max-width:320px;height:54px;border:0;border-radius:14px;background:#fff;color:#111;font-size:17px;font-weight:700}
  #err{position:fixed;left:14px;right:14px;bottom:120px;background:#c33;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;z-index:6;display:none}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .25s}
  #shot{position:fixed;inset:0;z-index:13;background:#000;display:none;flex-direction:column}
  #shot img{flex:1;object-fit:contain;min-height:0;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
  #shot div{display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px)}
  #shot button{flex:1;height:50px;border:0;border-radius:12px;font-size:15px;font-weight:700;background:#fff;color:#111}
  #shot button.ghost{background:#fff2;color:#fff}
  .mbi-simpletalk-kakao,[class*=simpletalk]{display:none !important}
</style>
</head>
<body>
<video id="cam" playsinline autoplay muted></video>
<canvas id="gl"></canvas>

<div id="top"><button id="home" aria-label="디자인짐으로 돌아가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>디자인짐으로 돌아가기</button><button id="x" aria-label="닫기">×</button></div>
<div id="prog"><i></i><span id="progt"></span></div>
<div id="dbg"></div>
<div id="ring"><i></i></div>
<div id="hint">바닥이 보이게 폰을 살짝 내리고<br>여기를 탭하세요<small>그 자리에 매트가 놓입니다</small></div>
<div id="tip">한 손가락으로 옮기기 · 두 손가락으로 비틀어 돌리기</div>
<div id="err"></div>
<div id="flash"></div>

<div id="bottom">
  <div id="chips"></div>
  <div id="acts">
    <button id="rot" class="ghost sq" aria-label="90도 회전">↻</button>
    <button id="reset" class="ghost">다시 놓기</button>
    <button id="snap">사진 저장</button>
  </div>
</div>

<div id="shot"><img id="shotimg" alt=""><p id="savetip">사진을 <b>길게 눌러</b> ‘사진 앱에 저장’을 선택하세요</p><div><button id="shotclose" class="ghost">닫기</button><a id="shotdl" download="designgym-ar.jpg" style="flex:1"><button style="width:100%">저장하기</button></a></div></div>

<div id="tapori"><div><b>화면을 한 번 톡 눌러주세요</b><small>폰 움직임을 따라 매트가 제자리에 고정돼요</small></div></div>
<div id="start">
  <h1>내 방에 매트를 놓아볼게요</h1>
  <p>카메라와 움직임 센서 권한을 허용해 주세요.<br>앱을 나가지 않고 바로 볼 수 있습니다.</p>
  <button id="go">카메라 켜기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
  'use strict';
  var BASE = 'https://nyangnyang.kr/ar';
  var COLORS = [
    { key:'active_steps',   label:'Active steps',   sw:'#2f3542' },
    { key:'before_sunrise', label:'Before sunrise', sw:'#d9b7a7' },
    { key:'warm_sunlight',  label:'Warm sunlight',  sw:'#e7c86a' }
  ];
  var EYE_H = 1.3;           // 바닥에서 폰까지 높이(m). 탭할 때 깊이 추정으로 자동 계산되고, 실패하면 이 값
  var q = (location.search.match(/[?&]c=([a-z_]+)/)||[])[1];
  var cur = COLORS.some(function(c){ return c.key===q; }) ? q : COLORS[0].key;

  var $ = function(id){ return document.getElementById(id); };
  var cam = $('cam'), gl = $('gl'), hint = $('hint'), ring = $('ring'), tip = $('tip'), errEl = $('err'), dbg = $('dbg');
  if (!/[?&](debug|diag)=1/.test(location.search)) dbg.style.display = 'none';   // 진단 글씨는 ?debug=1 일 때만
  function err(m){ errEl.textContent = m; errEl.style.display='block'; setTimeout(function(){ errEl.style.display='none'; }, 4000); }
  var HINT_DEFAULT = '바닥이 보이게 폰을 살짝 내리고<br>여기를 탭하세요<small>그 자리에 매트가 놓입니다</small>';

  /* ---------- three.js ---------- */
  var renderer = new THREE.WebGLRenderer({ canvas: gl, alpha:true, antialias:true, preserveDrawingBuffer:true });
  var IS_AND = /Android/i.test(navigator.userAgent);
  var IS_IOS_P = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), shotFile = null;
  renderer.setPixelRatio(Math.min(IS_AND ? 1.25 : 2, window.devicePixelRatio||1));   // 안드로이드는 GPU를 AI와 나눠 쓰므로 렌더 해상도를 조금 낮춤
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .78;
  var scene = new THREE.Scene();
  // 카메라 화각(세로). 안드로이드 기본 카메라가 아이폰보다 넓어서 70°로 그리면 매트가 실제보다 크게 보임 → 88°
  var FOV = +((location.search.match(/[?&]fov=([0-9.]+)/)||[])[1]) || (IS_AND ? 88 : 70);
  var camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 50);
  camera.position.set(0, EYE_H, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x665544, .42));
  var sun = new THREE.DirectionalLight(0xffffff, .22); sun.position.set(1, 3, 1); scene.add(sun);

  function shadowTexture(){
    var c = document.createElement('canvas'); c.width = 512; c.height = 256; var x = c.getContext('2d');
    var w = 512, h = 256, steps = 18, maxPad = 76, minPad = 22;
    for (var i = 0; i < steps; i++){
      var t = i / (steps - 1), pad = maxPad - (maxPad - minPad) * t, r = 30;
      x.fillStyle = 'rgba(0,0,0,' + (0.028 + 0.012 * t) + ')';
      x.beginPath(); x.moveTo(pad+r, pad); x.arcTo(w-pad, pad, w-pad, h-pad, r); x.arcTo(w-pad, h-pad, pad, h-pad, r); x.arcTo(pad, h-pad, pad, pad, r); x.arcTo(pad, pad, w-pad, pad, r); x.closePath(); x.fill();
    }
    return new THREE.CanvasTexture(c);
  }
  var shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent:true, depthWrite:false }));
  shadow.rotation.x = -Math.PI/2; shadow.position.y = -.004; shadow.renderOrder = -1;

  var mat = null, placed = false, loading = {}, ready = {}, matSize = { x:1.83, z:0.61 };
  var loader = new THREE.GLTFLoader();
  function useHolder(holder){
    if (mat === holder) return;
    if (mat){ holder.position.copy(mat.position); holder.rotation.copy(mat.rotation); holder.visible = mat.visible; scene.remove(mat); }
    else holder.visible = false;
    mat = holder; scene.add(mat);
    try{ camera.updateMatrixWorld(); renderer.compile(scene, camera); }catch(e){}   // 매트 셰이더를 미리 준비 → 처음 놓을 때 멈칫 줄임
    matSize = holder.userData.size;
    shadow.scale.set(matSize.x * 1.12, matSize.z * 1.4, 1);
    holder.add(shadow);
  }
  function loadMat(key){
    if (ready[key]){ useHolder(ready[key]); return; }
    if (loading[key]) return;
    loading[key] = true;
    loader.load(BASE + '/models/mat_' + key + '.glb', function(g){
      var obj = g.scene;
      obj.traverse(function(n){
        if (!n.isMesh) return;
        (Array.isArray(n.material) ? n.material : [n.material]).forEach(function(m){
          if (!m) return;
          if (m.isMeshBasicMaterial) m.color.multiplyScalar(.78);
          if (m.emissive) m.emissive.multiplyScalar(.5);
          var tx = m.map, im = tx && tx.image;   // 3072px 텍스처를 폰에서 GPU에 올리면 화면이 잠깐 멈춤 → 1536px로 줄여서 올림(화면상 차이 거의 없음)
          if (im && im.width > 1600){ try{ var cv = document.createElement('canvas'), sc = 1536 / im.width; cv.width = 1536; cv.height = Math.round(im.height * sc); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); tx.image = cv; tx.needsUpdate = true; }catch(e){} }
          m.needsUpdate = true;
        });
      });
      var box = new THREE.Box3().setFromObject(obj);
      var size = new THREE.Vector3(); box.getSize(size);
      obj.position.sub(box.getCenter(new THREE.Vector3())); obj.position.y += size.y/2;
      var holder = new THREE.Group(); holder.add(obj); holder.userData.size = { x:size.x, z:size.z };
      ready[key] = holder; loading[key] = false;
      if (key === cur) useHolder(holder);
    }, undefined, function(){ loading[key] = false; err('매트 모델을 불러오지 못했어요'); });
  }

  /* ---------- 자이로 → 카메라 회전 ---------- */
  var zee = new THREE.Vector3(0,0,1), euler = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
  var ori = null, haveOri = false;
  function screenAngle(){ var a = (screen.orientation && screen.orientation.angle) || window.orientation || 0; return a * Math.PI/180; }
  function applyOri(){
    if (!ori) return;
    var a = THREE.MathUtils.degToRad(ori.alpha||0), b = THREE.MathUtils.degToRad(ori.beta||0), g = THREE.MathUtils.degToRad(ori.gamma||0), o = screenAngle();
    euler.set(b, a, -g, 'YXZ');
    var tq = IS_AND ? (applyOri.tq || (applyOri.tq = new THREE.Quaternion())) : camera.quaternion;
    tq.setFromEuler(euler);
    tq.multiply(q1);
    tq.multiply(q0.setFromAxisAngle(zee, -o));
    if (IS_AND){   // 안드로이드 자이로는 값이 튀어서 매트가 덜덜 떨림 → 목표 방향으로 부드럽게 따라가게(빨리 돌리면 바로 따라감)
      if (!applyOri.init){ camera.quaternion.copy(tq); applyOri.init = true; return; }
      var ang = camera.quaternion.angleTo(tq);
      camera.quaternion.slerp(tq, ang > 0.35 ? 1 : (ang > 0.08 ? 0.5 : 0.28));
    }
  }
  window.addEventListener('deviceorientation', function(e){ if (e.alpha===null && e.beta===null) return; ori = e; if (!haveOri){ var tp = document.getElementById('tapori'); if (tp) tp.style.display = 'none'; } haveOri = true; }, true);

  /* ---------- 깊이 추정: 별도 스레드(Worker)에서 계속 돌며 폰 높이를 잰다 ---------- */
  /* 모델 파일 출처 — 1차 GitHub(jsDelivr CDN, 트래픽 제한 없음) → 실패하면 2차 Supabase(예전 서버).
     ▶ 예전 서버로만 받게 하려면 SRC 를 'supa' 로 바꾸면 된다 (주소 뒤 ?src=supa 로 저장 없이 확인 가능). */
  var SRC = (location.search.match(/[?&]src=(cdn|supa)/)||[])[1] || 'cdn';
  var CDN_BASE = 'https://cdn.jsdelivr.net/gh/koreanolleh/designgym-ar@';   // 모델마다 브랜치 1개 (jsDelivr는 브랜치당 50MB 제한)
  var DEPTH_BASE = 'https://udxqbfyxacfddkazolhq.supabase.co/storage/v1/object/public/ar/', DEPTH_VER = '2';
  var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var ORT_VER = IS_IOS ? '1.20.1' : '1.31.1';   // iOS: 검증된 1.20+fp16 / Android(Adreno): 1.31+fp32 (1.20은 Adreno에서 첫 실행이 안 끝남)
  // cdn: GitHub 파일(pk_* 는 int8 팩 → 폰에서 fp16 복원) / supa: 예전 Supabase 파일(그대로). 복원 후에는 둘 다 완전히 같은 모델.
  var MODELS = { webgpu: IS_IOS ? { name:'depth_fp16', parts:6, ver:'1', cdn:{ name:'pk_fp16', parts:4, pack:true, ref:'m-ios' }, w:378, h:518, cal:0.8 } : { name:'depth_gl2', parts:12, ver:'1', w:378, h:518, cal:0.8 },
                 litert:{ name:'depth_lrt', parts:6, ver:'1', cdn:{ name:'pk_lrt', parts:4, pack:true, ref:'m-and' }, w:378, h:518, cal:0.57 },
                 wasm: IS_IOS ? { name:'depth_int8', parts:4, ver:'2', cdn:{ name:'depth_int8', parts:5, ref:'m-cpu' }, w:378, h:518, cal:0.8 } : { name:'depth_s_int8', parts:4, ver:'1', cdn:{ name:'depth_s_int8', parts:5, ref:'m-cpus' }, w:266, h:364, cal:0.62, fallback:{ name:'depth_int8', parts:4, ver:'2', cdn:{ name:'depth_int8', parts:5, ref:'m-cpu' }, w:378, h:518, cal:0.8 } } };
  var LRT_CDN = 'https://cdn.jsdelivr.net/npm/@litertjs/core@2.6.0/';
  var DW = 378, DH = 518;                       // 모델 입력 크기 (모델별로 initModel에서 설정)
  var epForce = (location.search.match(/[?&]ep=(webgpu|wasm)/)||[])[1];
  var OPT = (location.search.match(/[?&]opt=(disabled|basic|extended|all)/)||[])[1] || (IS_IOS ? 'all' : 'basic');   // Android(Adreno)는 융합 커널 버그 회피를 위해 기본 basic
  var hideQ = (location.search.match(/[?&]hide=([a-z0-9,-]+)/)||[])[1];
  var HIDE = hideQ === 'none' ? [] : hideQ ? hideQ.split(',') : (IS_IOS ? [] : ['subgroups','subgroups-f16','shader-f16']);   // Adreno 드라이버 버그 회피: 확장 기능 숨김
  var epForce2 = (location.search.match(/[?&]ep=(litert)/)||[])[1];
  var depthState = 'idle', worker = null, ep = epForce2 || epForce || ((window.navigator && navigator.gpu) ? (IS_IOS ? 'webgpu' : 'litert') : 'wasm'), runErrs = 0;
  var lrt = null, lrtModel = null, why = '';   // why: 엔진 전환 사유(디버그 표시)   // LiteRT.js (Android GPU 경로: ORT WebGPU가 Adreno에서 깨져서 TFLite 런타임 사용)
  var targetH = EYE_H, measured = 0, firstDone = false, inflight = false, snapQ = null, sentAt = 0, stalls = 0;
  var CAL_Q = +((location.search.match(/[?&]cal=([0-9.]+)/)||[])[1]) || 0, CAL = CAL_Q || 0.8;   // 모델이 높이를 크게 보는 경향 보정 (모델별 기본값, URL cal=로 덮어쓰기)
  /* ---- 다운로드 진행 표시 ---- */
  var prog = $('prog'), progT = $('progt'), progBytes = {}, progTotal = 0, PROG_MSG = '실제 크기 맞추는 중…';
  function setProg(phase, frac){ progT.textContent = phase + (frac != null ? ' ' + Math.round(frac*100) + '%' : ''); prog.style.display = phase ? 'flex' : 'none'; }
  function dlProgress(){ var now = Date.now(); if (now - (dlProgress.t||0) < 120) return; dlProgress.t = now; var got = 0; for (var k in progBytes) got += progBytes[k]; setProg(PROG_MSG, progTotal ? Math.min(.85, got/progTotal*.85) : 0); }
  function readAll(r, key){
    var len = +r.headers.get('content-length') || 0;
    if (len) progTotal += len;
    if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function(ab){ if (!len) progTotal += ab.byteLength; progBytes[key] = ab.byteLength; dlProgress(); return ab; });
    var rd = r.body.getReader(), chunks = [], got = 0;
    return new Promise(function(res, rej){
      (function pump(){ rd.read().then(function(x){
        if (x.done){ var out = new Uint8Array(got), o = 0; chunks.forEach(function(c){ out.set(c, o); o += c.length; }); if (!len) progTotal += got; progBytes[key] = got; dlProgress(); res(out.buffer); return; }
        chunks.push(x.value); got += x.value.length; progBytes[key] = got; dlProgress(); pump();
      })['catch'](rej); })();
    });
  }

    if (measured < (ep === 'wasm' ? 1 : 3)){ if (!IS_AND || now - lastMeasureAt > 1200) measureOnce(); return; }   // 안드로이드: 첫 측정 뒤 보정 측정은 간격을 두고(연속으로 돌리면 화면이 뚝뚝 끊김)           // 초기 안정화
    var fast = lastMs > 0 && lastMs < 700;                                        // GPU가 빠르면(0.7초 미만) 주기적으로 재서 자세 변화에 바로 따라감
    if (fast && !IS_AND){ if (now - lastMeasureAt > 2000) measureOnce(); return; }   // 안드로이드는 주기적 재측정 안 함(측정할 때마다 화면이 툭 끊김) → 움직였다 멈춘 직후에만   // 안드로이드: 폰을 움직이는 중엔 재지 않음(버벅임 방지)
    if (IS_AND){   // 안드로이드: 폰 기울기가 달라져도(일어서기·앉기·고개 숙이기) 움직임으로 보고 다시 잰다
      var fw = tickDir || (tickDir = new THREE.Vector3()); camera.getWorldDirection(fw);
      var pitchNow = Math.asin(Math.max(-1, Math.min(1, fw.y)));
      if (lastPitch === null) lastPitch = pitchNow;
      if (Math.abs(pitchNow - lastPitch) > 0.12){ lastPitch = pitchNow; lastMoveAt = now; moved = true; moves++; }
      if (!moved && now - lastMeasureAt > 5000 && now - lastMoveAt > 1200) measureOnce();   // 가만히 있을 때 가끔 확인
    }
    if (moved && now - lastMoveAt > 600 && now - lastMeasureAt > 1500){ moved = false; pendingSecond = !IS_AND; measureOnce(); return; }   // 움직임 멈춘 직후 (안드로이드는 한 번만 재서 끊김 줄임)
    if (now - lastMeasureAt > (IS_AND ? 20000 : (haveMotion ? 8000 : 4000))) measureOnce();           // 안전장치
  }, 150);
  // 깊이 맵 + (프레임 찍은 순간의) 자이로 방향으로 바닥 픽셀들의 "폰 높이"를 구해 중앙값을 쓴다
  function heightFromDepth(d, q){
    var snap = new THREE.PerspectiveCamera(camera.fov, camera.aspect, camera.near, camera.far);
    snap.quaternion.copy(q); snap.updateMatrixWorld();
    var inv = q.clone().invert(), hs = [], v3 = new THREE.Vector3();
    for (var v = Math.floor(DH*.45); v < DH; v += 4){
      for (var u = Math.floor(DW*.08); u < DW*.92; u += 4){
        v3.set((u+.5)/DW*2-1, -((v+.5)/DH*2-1), .5).unproject(snap);
        var dir = v3.normalize();                                 // snap 위치는 원점
        if (dir.y > -0.08) continue;                              // 바닥을 향하지 않는 방향
        var z = -dir.clone().applyQuaternion(inv).z; if (z <= .1) continue;
        var dist = d[v*DW+u] / z;                                 // 모델 깊이(z) → 광선 길이
        hs.push(-dir.y * dist);                                   // 그 점이 바닥이면 = 폰 높이
      }
    }
    var fwd = new THREE.Vector3(0,0,-1).applyQuaternion(q);
    diag = '기울기 ' + Math.round(Math.asin(-fwd.y)*180/Math.PI) + '° · d↓' + d[(DH-8)*DW + (DW>>1)].toFixed(2) + ' d중' + d[(DH>>1)*DW + (DW>>1)].toFixed(2) + ' · cam ' + cam.videoWidth + 'x' + cam.videoHeight + ' · ' + inStat + ' · n' + hs.length;
    if (hs.length < 50) return null;
    hs.sort(function(a,b){ return a-b; });
    var med = hs[Math.floor(hs.length*.5)], s = 0, n = 0;
    for (var i = 0; i < hs.length; i++){ if (Math.abs(hs[i]-med) < med*.15){ s += hs[i]; n++; } }
    var h = n ? s/n : med;
    return Math.max(.3, Math.min(3.5, h));
  }
  var badGpu = 0;
  function onDepth(d, ms){
    inflight = false; lastMs = ms;
    // GPU 결과 검증: 화면 전체가 거의 같은 값이거나 비정상적으로 크면(드라이버 버그) CPU로 자동 전환
    var sm = 0, sq = 0, cnt = 0; for (var k = 0; k < d.length; k += 97){ sm += d[k]; sq += d[k]*d[k]; cnt++; }
    var mu = sm/cnt, sd = Math.sqrt(Math.max(0, sq/cnt - mu*mu));
    if ((ep === 'webgpu' || ep === 'litert') && (!(sd > 0.008 * mu) || mu > 20 || !(mu > 0.05))){
      badGpu++; dbg.textContent = 'GPU 결과 이상 (' + badGpu + ') μ' + mu.toFixed(2) + ' σ' + sd.toFixed(3);
      if (badGpu >= 3){ why = 'GPU 결과 이상 μ' + mu.toFixed(2) + ' σ' + sd.toFixed(3); badGpu = 0; measured = 0; ep = 'wasm'; depthState = 'loading'; dbg.textContent = 'GPU 결과 이상 → CPU로 전환'; initModel(); }
      return;
    }
    var h = heightFromDepth(d, snapQ || camera.quaternion.clone());
    if (h){ h = Math.max(.3, Math.min(2.2, h * CAL)); }
    if (h){
      measured++; stalls = 0; runErrs = 0; badGpu = 0;
      if (!firstDone){ EYE_H = h; camera.position.y = h; firstDone = true; setProg(''); }
      targetH = h;                                                // 실제 반영은 tick()에서 부드럽게
      dbg.textContent = '폰 높이 ' + EYE_H.toFixed(2) + 'm (측정 ' + (h/CAL).toFixed(2) + '×' + CAL + ') · ' + (ms/1000).toFixed(1) + 's · #' + measured + ' · ' + ep + '/' + OPT + (HIDE.length ? '/h' : '') + ' · mv' + moves + '\n' + diag + (why ? '\n전환: ' + why : '');
    } else dbg.textContent = '바닥이 안 보여요 · 높이 ' + EYE_H.toFixed(2) + 'm · ' + ep;
    lastMeasureAt = Date.now();
    if (pendingSecond){ pendingSecond = false; setTimeout(measureOnce, 350); }
  }
  function measureThenPlace(x, y){
    if (depthState !== 'ready' || firstDone){ place(x, y); return; }
    ring.style.opacity = 0; hint.innerHTML = '바닥까지 거리를 재는 중…<small>잠시만요</small>'; hint.style.opacity = 1;
    var wait = function(){ if (firstDone || depthState !== 'ready') place(x, y); else setTimeout(wait, 150); };
    wait();
  }

  /* ---------- 터치: 탭 놓기 / 한 손가락 이동 / 두 손가락 회전 ---------- */
  var look = { yaw:0, pitch:-.6 };
  var pts = {}, gest = null;
  function ptArr(){ return Object.keys(pts).map(function(k){ return pts[k]; }); }
  gl.addEventListener('pointerdown', function(e){
    pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    var p = ptArr();
    if (p.length === 1) gest = { kind:'one', x:e.clientX, y:e.clientY, moved:false, t:Date.now(), yaw:look.yaw, pitch:look.pitch };
    else if (p.length === 2 && mat){
      var dx = p[1].x-p[0].x, dy = p[1].y-p[0].y;
      gest = { kind:'two', a:Math.atan2(dy,dx), rot:mat.rotation.y };
    }
  });
  gl.addEventListener('pointermove', function(e){
    if (!pts[e.pointerId] || !gest) return;
    pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    var p = ptArr();
    if (gest.kind === 'one' && p.length === 1){
      var dx = e.clientX - gest.x, dy = e.clientY - gest.y;
      if (Math.abs(dx)+Math.abs(dy) > 6) gest.moved = true;
      if (!haveOri){ look.yaw = gest.yaw - dx*.005; look.pitch = Math.max(-1.4, Math.min(.4, gest.pitch - dy*.005)); }
      else if (placed && mat && gest.moved){ var f = floorHit(e.clientX, e.clientY); if (f){ mat.position.x = f.x; mat.position.z = f.z; } }
    } else if (gest.kind === 'two' && p.length === 2 && mat){
      var ddx = p[1].x-p[0].x, ddy = p[1].y-p[0].y, a = Math.atan2(ddy,ddx);
      mat.rotation.y = gest.rot - (a - gest.a);
    }
  });
  function up(e){
    delete pts[e.pointerId];
    var p = ptArr();
    if (gest && gest.kind === 'one' && p.length === 0){
      var tap = !gest.moved && Date.now()-gest.t < 400; gest = null;
      if (tap && !placed) measureThenPlace(e.clientX, e.clientY);
    } else if (p.length === 0) gest = null;
    else if (p.length === 1) gest = { kind:'one', x:p[0].x, y:p[0].y, moved:true, t:0, yaw:look.yaw, pitch:look.pitch };
  }
  gl.addEventListener('pointerup', up); gl.addEventListener('pointercancel', up);

  function floorHit(x, y){
    var ndc = new THREE.Vector2((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
    var rc = new THREE.Raycaster(); rc.setFromCamera(ndc, camera);
    var dir = rc.ray.direction; if (dir.y >= -0.03) return null;
    var t = -rc.ray.origin.y / dir.y; if (t > 8) return null;
    return rc.ray.origin.clone().add(dir.multiplyScalar(t));
  }
  function place(x, y, tries){
    if (!mat){ loadMat(cur); tries = tries || 0; if (tries < 30) setTimeout(function(){ place(x, y, tries + 1); }, 200); return false; }   // 매트 파일이 아직이면 받는 대로 놓기
    var p = floorHit(x, y);
    if (!p){ hint.innerHTML = HINT_DEFAULT; hint.style.opacity = 1; ring.style.opacity = 1; return false; }
    mat.position.set(p.x, 0, p.z);
    var f = new THREE.Vector3(); camera.getWorldDirection(f);
    mat.rotation.y = Math.atan2(f.x, f.z) + Math.PI/2;
    mat.visible = true; placed = true;
    hint.style.opacity = 0; ring.style.opacity = 0;
    tip.style.opacity = 1; setTimeout(function(){ tip.style.opacity = 0; }, 4000);
    return true;
  }

  /* ---------- 루프 ---------- */
  function resize(){ var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();
  function tick(){
    if (haveOri) applyOri(); else camera.quaternion.setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ'));
    if (firstDone && Math.abs(targetH - EYE_H) > .002){ EYE_H += (targetH - EYE_H) * .2; camera.position.y = EYE_H; }
    if (placed || !tick.blank){ renderer.render(scene, camera); tick.blank = !placed; } else camera.updateMatrixWorld();   // 안 그릴 때도 카메라 방향은 갱신(탭 위치 계산에 필요)   // 매트를 놓기 전엔 그릴 게 없으니 GPU를 AI에 양보
    requestAnimationFrame(tick);
  }

  /* ---------- UI ---------- */
  var chips = $('chips');
  COLORS.forEach(function(c){
    var b = document.createElement('button'); b.className = 'chip' + (c.key===cur?' on':''); b.innerHTML = '<i style="background:' + c.sw + '"></i><span>' + c.label + '</span>'; b.title = c.label;
    b.addEventListener('click', function(){ cur = c.key; [].forEach.call(chips.children, function(x){ x.className='chip'; }); b.className='chip on'; loadMat(cur); });
    chips.appendChild(b);
  });
  $('rot').addEventListener('click', function(){ if (mat && placed) mat.rotation.y += Math.PI/2; });
  $('reset').addEventListener('click', function(){ if (mat) mat.visible=false; placed=false; hint.innerHTML = HINT_DEFAULT; hint.style.opacity=1; ring.style.opacity=1; });
  var PNO = { active_steps:29, before_sunrise:33, warm_sunlight:34 };
  function goHome(){ location.href = 'https://m.designgym.co.kr/product/detail.html?product_no=' + (PNO[cur] || 29); }
  $('home').addEventListener('click', goHome);
  $('x').addEventListener('click', function(){ if (history.length > 1 && document.referrer && /designgym/.test(document.referrer)) history.back(); else goHome(); });

  $('snap').addEventListener('click', function(){
    try{
      var c = document.createElement('canvas'); c.width = innerWidth*2; c.height = innerHeight*2; var ctx = c.getContext('2d');
      var vw = cam.videoWidth||1, vh = cam.videoHeight||1, s = Math.max(c.width/vw, c.height/vh), dw = vw*s, dh = vh*s;
      ctx.drawImage(cam, (c.width-dw)/2, (c.height-dh)/2, dw, dh);
      ctx.drawImage(renderer.domElement, 0, 0, c.width, c.height);
      ctx.fillStyle = '#fff'; ctx.font = '600 '+(c.width*.028)+'px -apple-system,system-ui,sans-serif'; ctx.textAlign='right'; ctx.shadowColor='#0008'; ctx.shadowBlur=8;
      ctx.fillText('DESIGN:GYM', c.width-c.width*.04, c.height-c.height*.035);
      var url = c.toDataURL('image/jpeg', .92);
      $('shotimg').src = url; $('shotdl').href = url; $('shot').style.display='flex';
      shotFile = null; $('savetip').style.display = 'none';
      if (IS_IOS_P) c.toBlob(function(b){ try{ var f = new File([b], 'designgym-ar.jpg', { type:'image/jpeg' }); if (navigator.canShare && navigator.canShare({ files:[f] })) shotFile = f; }catch(e){} }, 'image/jpeg', .92);
      $('flash').style.opacity = 1; setTimeout(function(){ $('flash').style.opacity = 0; }, 120);
    }catch(e){ err('사진 저장에 실패했어요'); }
  });
  $('shotclose').addEventListener('click', function(){ $('shot').style.display='none'; });
  /* 아이폰: download 링크는 '파일' 앱에 저장돼 사진첩에 안 보임 → 공유 시트('이미지 저장')로 사진첩에 저장, 안 되면 길게 눌러 저장 안내 */
  $('shotdl').addEventListener('click', function(ev){
    if (!IS_IOS_P) return;
    ev.preventDefault();
    if (shotFile){ navigator.share({ files:[shotFile] })['catch'](function(e){ if (!e || e.name !== 'AbortError') $('savetip').style.display = 'block'; }); return; }
    $('savetip').style.display = 'block';
  });

  /* ---------- 시작 ----------
     버튼 없이 바로 카메라 권한을 묻는다. (안드로이드: 그대로 시작 / 아이폰: 링크·상품 페이지에서 누를 때 움직임 권한을 미리 받아두고,
     못 받은 경우에만 '화면을 한 번 톡' 안내를 띄워 그 탭으로 권한을 받는다. 카메라를 못 열면 예전 '카메라 켜기' 화면을 보여준다) */
  var needMotionAsk = typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function';
  var started = false;
  function askMotion(){
    var a = needMotionAsk ? DeviceOrientationEvent.requestPermission()['catch'](function(){ return 'denied'; }) : Promise.resolve('granted');
    var b = (typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function') ? DeviceMotionEvent.requestPermission()['catch'](function(){ return 'denied'; }) : Promise.resolve('granted');
    return a.then(function(){ return b; });
  }
  function startCam(){
    return navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false })
      .then(function(st){ cam.srcObject = st; return cam.play()['catch'](function(){}); })
      .then(function(){
        if (started) return; started = true;
        $('start').style.display = 'none'; tick(); loadDepth();
        setTimeout(function(){ loadMat(cur); }, 1500);   // 시작할 때 무거운 일을 한꺼번에 몰지 않게: AI 먼저, 매트는 조금 뒤에
        // 아이폰에서 움직임 권한이 아직 없으면(자이로 신호가 안 오면) 한 번 탭해서 받는다
        if (needMotionAsk) setTimeout(function(){ if (!haveOri) $('tapori').style.display = 'flex'; }, 300);   // 움직임 권한 안내를 빨리 띄움(신호가 오면 자동으로 닫힘)
      });
  }
  $('tapori').addEventListener('click', function(){ $('tapori').style.display = 'none'; askMotion(); });
  $('go').addEventListener('click', function(){
    var btn = this; btn.disabled = true; btn.textContent = '권한 확인 중…';
    askMotion().then(startCam)['catch'](function(e){
      btn.disabled = false; btn.textContent = '다시 시도';
      err('카메라를 열 수 없어요. 권한을 허용해 주세요. (' + (e && e.name || e) + ')');
    });
  });
  if (DIAG){ $('start').style.display = 'none'; runDiag(); }
  else {
    $('start').style.visibility = 'hidden';                    // 바로 권한 창이 뜨도록 안내 화면은 숨겨두고
    startCam()['catch'](function(){ $('start').style.visibility = 'visible'; });   // 안 되면 예전 '카메라 켜기' 화면
  }
})();
</script>
</body>
